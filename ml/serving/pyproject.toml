# Lint configuration for the retrieval service.
#
# This service is a separate deployable with its own dependencies and its own Dockerfile,
# and `ml/` sits outside the scope of `backend/pyproject.toml`'s ruff run. It gets its own
# config so `ruff check .` works from this directory and so a future change that folds
# `ml/` into the main lint scope does not inherit a pile of findings — which is exactly
# the situation `retriever.py` left behind with its 46 unexempted long lines.
#
#     ruff check . && ruff format --check .
#
# Settings mirror backend/pyproject.toml deliberately: one house style, not two.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "S"]
ignore = ["S101", "S311", "ARG001", "ARG002", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# The self-test stubs torch with lambdas that must accept the real signatures and
# discard them — unused arguments are the point, not an oversight. S105 covers one
# assignment of a fake secret to `app.SHARED_SECRET`, which is the subject of the test
# immediately below it.
"selftest.py" = ["ARG005", "S105", "S106", "E402"]
# One line holds a 34-character Urdu question as \u escapes, so the source stays pure
# ASCII — a cp1252 console cannot encode Urdu and has crashed this project twice. The
# escapes make the line long; unescaping it would trade a lint finding for a real bug.
"measure.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
