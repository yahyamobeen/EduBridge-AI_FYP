[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edubridge-backend"
version = "0.1.0"
description = "EduBridge AI Backend - Authentication Module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.0",
    "cryptography>=42.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    "resend>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RET", "S"]
# S105 (hardcoded password) is deliberately NOT ignored: suppressing it
# globally in the authentication module is the wrong default. Silence it per
# line where a match is genuinely a false positive.
# S101 stays ignored for pytest's assert; ARG001/ARG002 and B008 for FastAPI's
# dependency-injection signatures.
ignore = ["S101", "S311", "ARG001", "ARG002", "B008", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
