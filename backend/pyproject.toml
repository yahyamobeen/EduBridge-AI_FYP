[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edubridge-backend"
version = "0.1.0"
description = "EduBridge AI Backend - Authentication Module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.0",
    "cryptography>=42.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    # Runtime HTTP client for the server-side Cloudflare siteverify call
    # (moved here from dev; the package was already pinned by dev).
    "httpx>=0.27.0",
    # Crops the figure region out of a textbook page scan (tdd.md §3.2a).
    #
    # ⚠️ ALREADY PRESENT, TRANSITIVELY, VIA `qrcode[pil]` — and declared here anyway.
    # Depending on a library only through another package's extra is how a dependency
    # silently disappears: drop 2FA QR codes, or let qrcode make Pillow optional, and
    # the tutor's figure cropping breaks with nothing in the manifest explaining why.
    # `requirements.txt` already pins the same version, so Render needs no change.
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
# The transactional-email provider is NOT settled (tdd.md open items) — the
# seam in app/auth/email.py is, and `EMAIL_PROVIDER=logging` is the default. So
# the SDK is an extra, installed only where mail is actually sent:
#   uv sync --extra email
# Adding a second provider means one more class and one more extra, not a
# change to any route or service.
email = ["resend>=2.0.0", "sendgrid>=6.11.0"]
# In-process ColQwen2, for `RETRIEVAL_MODE=local` only — a development machine or a GPU
# box. The model is ~5 GB resident at bfloat16 against a 512 MB deployment instance, so
# this is an extra and `requirements.txt` (which is what Render installs) must never
# carry it. The default `RETRIEVAL_MODE=remote` needs none of this:
#   uv sync --extra retrieval
# ⚠️ Install torch from the CPU index or pip pulls ~2.5 GB of CUDA wheels that are never
# used, and the build fails on a small instance:
#   --index-url https://download.pytorch.org/whl/cpu
retrieval = ["torch>=2.4.0", "colpali-engine>=0.3.18"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RET", "S"]
# S105 (hardcoded password) is deliberately NOT ignored: suppressing it
# globally in the authentication module is the wrong default. Silence it per
# line where a match is genuinely a false positive.
# S101 stays ignored for pytest's assert; ARG001/ARG002 and B008 for FastAPI's
# dependency-injection signatures.
ignore = ["S101", "S311", "ARG001", "ARG002", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Email bodies are inline-styled HTML, because that is what mail clients
# render. Wrapping the style attributes to 100 columns would make them harder
# to read, not easier, and changes nothing about the output.
"app/auth/email_templates.py" = ["E501"]
"app/retrieval/physics9/generator.py" = ["E501"]
# The syllabus index is 63 sub-topics, each with a keyword list. Wrapping those lists to
# 100 columns turns a scannable table into something you have to read line by line, and
# the table's whole value is that a contributor can check a chapter's coverage at a
# glance. Same reasoning as the two files above. ⚠️ These 46 long lines are INHERITED
# from `retriever.py`, which carried them unexempted — so `ruff check .` was already
# failing on this branch before the split, despite HISTORY.md claiming otherwise.
"app/retrieval/physics9/heuristic.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
