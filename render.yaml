# EduBridge AI — Render Blueprint
#
# Creates both services from this one repo:  Render dashboard → New → Blueprint.
# Every `sync: false` value is prompted for in the dashboard and never enters
# the repository (SEC-10).
#
# ─────────────────────────────────────────────────────────────────────────────
# THE ONE THING THAT BREAKS THIS DEPLOYMENT
#
# The refresh token is an httpOnly cookie set `SameSite=Lax`. Lax cookies are
# not sent on cross-SITE requests, and `onrender.com` is on the Public Suffix
# List -- so edubridge-frontend.onrender.com and edubridge-backend.onrender.com
# are two different sites to the browser. Called directly, the API would never
# receive the refresh cookie: login succeeds, then the user is silently signed
# out when the access token expires, in production only.
#
# The frontend therefore proxies `/api/*` to the backend (see
# frontend/next.config.mjs `rewrites`), which makes the API same-origin. That is
# why BACKEND_INTERNAL_URL exists and why NEXT_PUBLIC_API_BASE_URL is the
# relative `/api` rather than the backend's public URL.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ───────────────────────── FastAPI ─────────────────────────
  - type: web
    name: edubridge-backend
    runtime: python
    rootDir: backend
    plan: free
    # Nearest region to the Supabase project (ap-southeast-2, Sydney).
    region: singapore
    # requirements.txt is generated by `uv export` and MUST be regenerated with
    # `--extra email`, or the provider SDK is missing and email delivery fails
    # at the first send -- `SendGridEmailSender` raises a RuntimeError saying so,
    # but only once a user is already waiting for a link. The extra carries BOTH
    # SDKs, so this command is the same whichever provider is selected:
    #   uv export --format requirements-txt --no-hashes --no-emit-project \
    #             --extra email -o requirements.txt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # WITHOUT THIS, EVERY USER SHARES ONE RATE-LIMIT BUCKET.
      #
      # app/core/ratelimit.py keys the pre-authentication buckets on
      # `request.client.host` -- register at 5 per 5 minutes, login at 10 per
      # minute, refresh at 30 per minute. Behind the frontend's /api rewrite the
      # socket peer is the frontend service, so all three become global: the
      # sixth person to sign up inside five minutes gets a 429, whoever they are.
      #
      # Measured, both halves:
      #   - Next's rewrite forwards an existing X-Forwarded-For unchanged (it
      #     never ADDS one, but Render's edge sets it before the request reaches
      #     the frontend, so it is present and survives the hop).
      #   - uvicorn rewrites request.client.host from that header only when the
      #     peer is in its trust list, which defaults to 127.0.0.1. On Render the
      #     peer is Render's router, so the default ignores the header entirely.
      #     With this set, request.client.host becomes the real client address.
      #
      # An env var rather than --forwarded-allow-ips on the command line: the
      # shell glob-expands a bare `*` into a directory listing, and uvicorn then
      # exits on unexpected arguments.
      #
      # Trade-off, accepted deliberately: the backend has a public URL on this
      # plan, so a direct caller can spoof X-Forwarded-For and evade the
      # address-keyed limits. The per-ACCOUNT limits and the `locked_until`
      # ladder are unaffected, and ratelimit.py already names those as the real
      # control. Making the backend a private service removes the exposure.
      - key: FORWARDED_ALLOW_IPS
        value: "*"

      # Makes the refresh cookie Secure, and REFUSES both a "*" CORS origin and
      # EMAIL_PROVIDER=logging -- verification links written to a log file mean
      # nobody can finish signing up.
      - key: APP_ENV
        value: production

      # SendGrid, chosen in KAN-21. Resend's unverified free tier delivers ONLY
      # to the account owner's own address and rejects everything else at the
      # API, so a send could look successful and never leave -- which made the
      # guardian invite to a real parent impossible. `logging` is refused above
      # by APP_ENV=production.
      #
      # ⚠️ Changing this value alone is not enough. `email_provider` is a
      #    `Literal` in app/core/config.py and a provider missing from it is
      #    refused at BOOT, and the SDK must be in requirements.txt (see the
      #    `uv export --extra email` note at the top of this file).
      - key: EMAIL_PROVIDER
        value: sendgrid

      # MUST connect as app_backend, never postgres: the owner role bypasses
      # Row Level Security, which would leave every policy inert while the app
      # appears to work. app/core/db.py refuses to start if the role reports
      # rolsuper or rolbypassrls.
      - key: DATABASE_URL
        sync: false

      # Bypasses RLS on purpose — background jobs only, never a request path.
      - key: SERVICE_ROLE_DATABASE_URL
        sync: false

      # openssl rand -hex 32   (fresh values — do not reuse the dev ones)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: TOTP_ENCRYPTION_KEY
        sync: false

      - key: TURNSTILE_SECRET_KEY
        sync: false

      # The key for whichever provider EMAIL_PROVIDER names. Only one is read;
      # the other is ignored, so both can be present while a switch is in flight.
      - key: SENDGRID_API_KEY
        sync: false

      # Retained: `resend` is still a supported EMAIL_PROVIDER value. Unset
      # while SendGrid is the chosen provider.
      - key: RESEND_API_KEY
        sync: false

      # Must be a SENDER VERIFIED WITH SENDGRID -- either a Single Sender or an
      # address on an authenticated domain. SendGrid rejects a send from an
      # unverified From at the API, so the failure is loud rather than silent.
      #
      # ⚠️ Required whenever EMAIL_PROVIDER is a real provider: config.py
      #    refuses to boot without it. That check exists because the alternative
      #    is discovering the omission when the first student cannot verify.
      - key: EMAIL_FROM
        sync: false

      # The FRONTEND's public URL. This builds the links inside verification and
      # reset emails — leave it pointing at localhost and no one can finish
      # signing up.  https://edubridge-frontend.onrender.com
      - key: APP_BASE_URL
        sync: false

      # JSON array, not comma-separated. Never "*": with credentials enabled a
      # wildcard makes Starlette echo the caller's origin, so any site could use
      # a user's refresh cookie.
      #   ["https://edubridge-frontend.onrender.com"]
      # Only consulted for direct cross-origin calls; the rewrite above means
      # the browser never makes one. Set it correctly anyway.
      - key: CORS_ORIGINS
        sync: false

  # ───────────────────────── Next.js ─────────────────────────
  - type: web
    name: edubridge-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Match .github/workflows/frontend.yml exactly. That workflow runs the
      # same `npm ci` against the same package-lock.json on Node 24 and passes,
      # so 24 is the only version this lockfile is known to install under.
      #
      # Set to 22 first, and `npm ci` failed on Render with an EUSAGE error --
      # npm's "package.json and package-lock.json are not in sync" path, which
      # dumps the whole command usage and buries its own message. The lockfile
      # is written by the npm that ships with Node 24; an older npm resolves the
      # `overrides` block differently and calls it a mismatch.
      - key: NODE_VERSION
        value: "24"

      # NEXT_PUBLIC_API_MODE is gone. It selected an in-memory mock layer that
      # has been deleted; the comment here claimed "ships as mock" directly above
      # a `live` value, and reconciling the comment to the value would have put
      # seeded credentials into a production bundle.

      # Relative on purpose: the rewrite makes /api same-origin, which is what
      # keeps the SameSite=Lax refresh cookie working. Setting the backend's
      # public URL here re-breaks it.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api

      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: en
      - key: NEXT_PUBLIC_SUPPORTED_LOCALES
        value: "en,ur,ur-Latn"

      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false

      # The backend's public URL, set after its first deploy — then redeploy
      # this service. NEXT_PUBLIC_* values are inlined at build time, so a
      # changed env var needs a rebuild, not a restart.
      #   https://edubridge-backend.onrender.com
      - key: BACKEND_INTERNAL_URL
        sync: false

      # The unlisted path the administrator login is served at, without a
      # leading slash. proxy.ts rewrites it to /en/admin-login; every other
      # route to that page answers 404.
      #
      # NO NEXT_PUBLIC_ PREFIX, EVER. That prefix inlines a value into the
      # browser bundle and would publish this path to every visitor.
      #
      # Unlike the NEXT_PUBLIC_* values above, this one is read at RUNTIME, so a
      # change takes effect on restart and does not need a rebuild. Measured on
      # a production build: the server chunk keeps the literal
      # `process.env.ADMIN_LOGIN_PATH` read, and the value appears nowhere under
      # .next/ -- not in the client chunks, not in the middleware bundle.
      #
      # `sync: false` so the value is prompted for in the dashboard and never
      # enters the repository (SEC-10). Unset is safe: no rewrite happens and
      # the administrator login is unreachable.
      #
      # NOT A SECURITY CONTROL. POST /api/auth/admin/login is: it refuses every
      # non-administrator with a 401 identical to a wrong password, so learning
      # this path buys an attacker nothing.
      - key: ADMIN_LOGIN_PATH
        sync: false
